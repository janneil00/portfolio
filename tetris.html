<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON STACK // Tetris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void: #08070c;
    --bg-panel: #100e18;
    --bg-well: #0c0a13;
    --grid-line: #201c2c;
    --magenta: #ff2e88;
    --cyan: #2ef7ff;
    --amber: #ffb02e;
    --violet: #8b5cf6;
    --lime: #b6ff2e;
    --text-dim: #6f6a85;
    --text-bright: #f1eefc;
  }
 
  *{ box-sizing: border-box; }
 
  html, body{
    margin:0; padding:0;
    min-height:100%;
    background: var(--bg-void);
    color: var(--text-bright);
    font-family: 'Space Mono', monospace;
    overflow-x:hidden;
  }
 
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 24px 12px;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(139,92,246,0.14), transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(46,247,255,0.10), transparent 55%),
      var(--bg-void);
  }
 
  .scanlines{
    pointer-events:none;
    position:fixed; inset:0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
    z-index: 50;
  }
 
  .stage{
    display:flex;
    gap: 28px;
    align-items:flex-start;
    flex-wrap: wrap;
    justify-content:center;
    max-width: 920px;
  }
 
  .marquee{
    width:100%;
    text-align:center;
    margin-bottom: 6px;
  }
  .marquee h1{
    font-family:'Press Start 2P', monospace;
    font-size: clamp(18px, 4vw, 30px);
    letter-spacing: 2px;
    margin: 0 0 6px 0;
    color: var(--text-bright);
    text-shadow:
      0 0 6px var(--magenta),
      0 0 22px rgba(255,46,136,0.5),
      0 0 44px rgba(139,92,246,0.35);
  }
  .marquee .sub{
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--text-dim);
    text-transform: uppercase;
  }
 
  .well-wrap{
    position:relative;
    background: linear-gradient(180deg, #1a1626, var(--bg-panel));
    border-radius: 14px;
    padding: 14px;
    border: 1px solid #2a2438;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.4) inset,
      0 20px 60px rgba(0,0,0,0.6),
      0 0 40px rgba(139,92,246,0.08);
  }
 
  #board{
    display:block;
    background: var(--bg-well);
    border-radius: 6px;
    box-shadow: inset 0 0 0 1px #1c1826, inset 0 0 30px rgba(0,0,0,0.6);
  }
 
  .well-label{
    position:absolute;
    top: -11px;
    left: 18px;
    background: var(--bg-void);
    padding: 0 8px;
    font-family:'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--cyan);
    letter-spacing: 1px;
  }
 
  .panel{
    display:flex;
    flex-direction:column;
    gap: 14px;
    width: 220px;
  }
 
  .card{
    background: linear-gradient(180deg, #17131f, var(--bg-panel));
    border: 1px solid #2a2438;
    border-radius: 10px;
    padding: 14px 16px;
    position:relative;
  }
  .card .well-label{ left: 14px; }
 
  .card-title{
    font-family:'Press Start 2P', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin: 0 0 8px 0;
  }
 
  .stat-value{
    font-family:'Press Start 2P', monospace;
    font-size: 20px;
    color: var(--amber);
    text-shadow: 0 0 12px rgba(255,176,46,0.5);
  }
  .stat-value.small{ font-size: 16px; }
 
  #nextCanvas, #holdCanvas{
    display:block;
    margin: 0 auto;
    background: var(--bg-well);
    border-radius: 6px;
    box-shadow: inset 0 0 0 1px #1c1826;
  }
 
  .keys{
    font-size: 11px;
    line-height: 1.9;
    color: var(--text-dim);
  }
  .keys b{
    color: var(--cyan);
    display:inline-block;
    width: 78px;
  }
 
  .btn-row{
    display:flex;
    gap: 10px;
  }
 
  button.action{
    flex:1;
    font-family:'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 12px 8px;
    background: linear-gradient(180deg, #241d33, #171223);
    border: 1px solid #3a3250;
    color: var(--text-bright);
    border-radius: 8px;
    cursor:pointer;
    transition: all .15s ease;
  }
  button.action:hover{
    border-color: var(--magenta);
    color: var(--magenta);
    box-shadow: 0 0 14px rgba(255,46,136,0.35);
  }
  button.action:active{ transform: translateY(1px); }
 
  .overlay{
    position:absolute; inset: 14px;
    background: rgba(8,7,12,0.88);
    backdrop-filter: blur(2px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 14px;
    border-radius: 6px;
    text-align:center;
    padding: 20px;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .overlay h2{
    font-family:'Press Start 2P', monospace;
    font-size: 18px;
    margin:0;
    color: var(--magenta);
    text-shadow: 0 0 16px rgba(255,46,136,0.6);
  }
  .overlay p{
    font-size: 11px;
    color: var(--text-dim);
    max-width: 220px;
    margin:0;
  }
  .overlay button.action{
    min-width: 140px;
    flex: none;
  }
 
  .touch{
    display:none;
    width:100%;
    max-width: 320px;
    margin: 4px auto 0;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .touch button{
    font-family:'Press Start 2P', monospace;
    font-size: 14px;
    padding: 16px 0;
    background: linear-gradient(180deg, #241d33, #171223);
    border: 1px solid #3a3250;
    color: var(--cyan);
    border-radius: 8px;
  }
  .touch button:active{ background: #2a2338; }
 
  @media (max-width: 720px){
    .stage{ flex-direction:column; align-items:center; }
    .panel{ flex-direction:row; flex-wrap:wrap; width: 100%; max-width: 400px; }
    .panel .card{ flex:1; min-width: 130px; }
    .touch{ display:grid; }
  }
</style>
</head>
<body>
 
<div class="scanlines"></div>
 
<div class="stage">
  <div class="marquee">
    <h1>TETRIS NG TANGA</h1>
    <div class="sub">Tara na Mag tetris</div>
  </div>
 
  <div class="well-wrap">
    <span class="well-label">WELL</span>
    <canvas id="board"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">PAUSED</h2>
      <p id="overlayText">Press start or hit P to resume.</p>
      <button class="action" id="overlayBtn">RESUME</button>
    </div>
  </div>
 
  <div class="panel">
    <div class="card">
      <span class="well-label">SCORE</span>
      <div class="stat-value" id="score">0</div>
    </div>
    <div class="card">
      <span class="well-label">LINES</span>
      <div class="stat-value small" id="lines">0</div>
    </div>
    <div class="card">
      <span class="well-label">LEVEL</span>
      <div class="stat-value small" id="level">1</div>
    </div>
    <div class="card">
      <span class="well-label">NEXT</span>
      <canvas id="nextCanvas" width="100" height="70"></canvas>
    </div>
    <div class="card">
      <span class="well-label">HOLD</span>
      <canvas id="holdCanvas" width="100" height="70"></canvas>
    </div>
    <div class="card">
      <span class="well-label">CONTROLS</span>
      <div class="keys">
        <div><b>&larr; &rarr;</b>move</div>
        <div><b>&uarr; / Z</b>rotate</div>
        <div><b>&darr;</b>soft drop</div>
        <div><b>space</b>hard drop</div>
        <div><b>C</b>hold</div>
        <div><b>P</b>pause</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="action" id="startBtn">START</button>
      <button class="action" id="pauseBtn">PAUSE</button>
    </div>
  </div>
 
  <div class="touch" id="touchControls">
    <button data-act="left">&larr;</button>
    <button data-act="rotate">&uarr;</button>
    <button data-act="right">&rarr;</button>
    <button data-act="hold">HOLD</button>
    <button data-act="down">&darr;</button>
    <button data-act="drop">DROP</button>
  </div>
</div>
 
<!--
  ginagawa-mo.mp3 must sit in the SAME FOLDER as this HTML file.
  It now plays automatically when the game ends (triggerGameOver).
  If it fails to load/play, a synthesized fallback tone plays instead.
-->
<audio id="loseSound" src="ginagawa-mo.mp3" preload="auto"></audio>
 
<script>
(function(){
  "use strict";
 
  // ---------- Config ----------
  const COLS = 10, ROWS = 20;
  let CELL = 28; // recalculated responsively
 
  const COLORS = {
    I: '#2ef7ff',
    O: '#ffb02e',
    T: '#8b5cf6',
    S: '#b6ff2e',
    Z: '#ff2e88',
    J: '#4d7bff',
    L: '#ff8a2e'
  };
 
  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };
  const PIECE_KEYS = Object.keys(SHAPES);
 
  // ---------- Audio ----------
  const loseSound = document.getElementById('loseSound');
 
  function playFallbackBeep(){
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const actx = new AudioCtx();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, actx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(60, actx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.15, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.45);
      osc.connect(gain).connect(actx.destination);
      osc.start();
      osc.stop(actx.currentTime + 0.45);
    } catch (err) {
      console.error('Fallback beep failed:', err);
    }
  }
 
  function playLoseSound(){
    try {
      loseSound.currentTime = 0;
      const playPromise = loseSound.play();
      if (playPromise && playPromise.catch){
        playPromise.catch(() => {
          playFallbackBeep();
        });
      }
    } catch (error) {
      console.error('Error playing lose sound:', error);
      playFallbackBeep();
    }
  }
 
  // ---------- Canvas setup ----------
  const boardCanvas = document.getElementById('board');
  const ctx = boardCanvas.getContext('2d');
  const nextCanvas = document.getElementById('nextCanvas');
  const nextCtx = nextCanvas.getContext('2d');
  const holdCanvas = document.getElementById('holdCanvas');
  const holdCtx = holdCanvas.getContext('2d');
 
  function resizeBoard(){
    const maxW = Math.min(window.innerWidth - 40, 340);
    CELL = Math.floor(maxW / COLS);
    CELL = Math.max(18, Math.min(CELL, 30));
    boardCanvas.width = CELL * COLS;
    boardCanvas.height = CELL * ROWS;
    draw();
  }
 
  // ---------- State ----------
  let grid = createGrid();
  let current = null;
  let nextQueue = [];
  let holdPiece = null;
  let canHold = true;
  let score = 0, lines = 0, level = 1;
  let dropInterval = 800;
  let dropTimer = 0;
  let lastTime = 0;
  let running = false;
  let paused = false;
  let gameOver = false;
  let animFrame = null;
  let flashRows = [];
  let flashTimer = 0;
 
  function createGrid(){
    return Array.from({length: ROWS}, () => Array(COLS).fill(null));
  }
 
  function randomBag(){
    const bag = [...PIECE_KEYS];
    for(let i = bag.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
    return bag;
  }
 
  function refillQueue(){
    if(nextQueue.length < 4){
      nextQueue.push(...randomBag());
    }
  }
 
  function spawnPiece(){
    refillQueue();
    const key = nextQueue.shift();
    refillQueue();
    const shape = SHAPES[key].map(([x,y]) => ({x, y}));
    const piece = {
      key,
      cells: shape,
      x: 3,
      y: key === 'I' ? -1 : 0,
      rotation: 0
    };
    if(collides(piece, 0, 0)){
      triggerGameOver();
    }
    return piece;
  }
 
  function collides(piece, dx, dy, cellsOverride){
    const cells = cellsOverride || piece.cells;
    for(const c of cells){
      const x = piece.x + c.x + dx;
      const y = piece.y + c.y + dy;
      if(x < 0 || x >= COLS || y >= ROWS) return true;
      if(y >= 0 && grid[y][x]) return true;
    }
    return false;
  }
 
  function rotateCells(piece){
    if(piece.key === 'O') return piece.cells;
    // rotate around approximate center using simple matrix rotation
    const cx = piece.key === 'I' ? 1.5 : 1;
    const cy = piece.key === 'I' ? 1.5 : 1;
    return piece.cells.map(c => {
      const relX = c.x - cx, relY = c.y - cy;
      const nx = -relY, ny = relX;
      return { x: Math.round(nx + cx), y: Math.round(ny + cy) };
    });
  }
 
  function tryRotate(piece){
    const rotated = rotateCells(piece);
    const kicks = [0, -1, 1, -2, 2];
    for(const k of kicks){
      if(!collides(piece, k, 0, rotated)){
        piece.cells = rotated;
        piece.x += k;
        return true;
      }
    }
    return false;
  }
 
  function lockPiece(piece){
    for(const c of piece.cells){
      const x = piece.x + c.x, y = piece.y + c.y;
      if(y >= 0) grid[y][x] = piece.key;
    }
    clearLines();
    canHold = true;
    current = spawnPiece();
  }
 
  function clearLines(){
    const fullRows = [];
    for(let y = 0; y < ROWS; y++){
      if(grid[y].every(cell => cell)) fullRows.push(y);
    }
    if(fullRows.length === 0) return;
 
    flashRows = fullRows;
    flashTimer = 140;
 
    setTimeout(() => {
      const newGrid = grid.filter((_, y) => !fullRows.includes(y));
      while(newGrid.length < ROWS){
        newGrid.unshift(Array(COLS).fill(null));
      }
      grid = newGrid;
      flashRows = [];
    }, 140);
 
    const points = [0, 100, 300, 500, 800][fullRows.length] * level;
    score += points;
    lines += fullRows.length;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(100, 800 - (level - 1) * 65);
    updateStats();
  }
 
  function hardDrop(){
    let dist = 0;
    while(!collides(current, 0, dist + 1)) dist++;
    current.y += dist;
    score += dist * 2;
    lockPiece(current);
    updateStats();
    dropTimer = 0;
  }
 
  function softDrop(){
    if(!collides(current, 0, 1)){
      current.y++;
      score += 1;
      updateStats();
    } else {
      lockPiece(current);
    }
    dropTimer = 0;
  }
 
  function move(dx){
    if(!collides(current, dx, 0)){
      current.x += dx;
    }
  }
 
  function doHold(){
    if(!canHold) return;
    canHold = false;
    if(holdPiece === null){
      holdPiece = current.key;
      current = spawnPiece();
    } else {
      const tmp = holdPiece;
      holdPiece = current.key;
      const shape = SHAPES[tmp].map(([x,y]) => ({x, y}));
      current = { key: tmp, cells: shape, x: 3, y: tmp === 'I' ? -1 : 0, rotation: 0 };
      if(collides(current, 0, 0)) triggerGameOver();
    }
    drawHold();
  }
 
  function ghostPosition(){
    let dist = 0;
    while(!collides(current, 0, dist + 1)) dist++;
    return dist;
  }
 
  // ---------- Drawing ----------
  function roundRect(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }
 
  function drawCell(c, px, py, size, color, glow){
    c.save();
    if(glow){
      c.shadowColor = color;
      c.shadowBlur = size * 0.6;
    }
    const pad = size * 0.07;
    const grad = c.createLinearGradient(px, py, px, py+size);
    grad.addColorStop(0, lighten(color, 25));
    grad.addColorStop(1, color);
    c.fillStyle = grad;
    roundRect(c, px+pad, py+pad, size-pad*2, size-pad*2, size*0.16);
    c.fill();
    c.restore();
  }
 
  function lighten(hex, pct){
    const num = parseInt(hex.slice(1), 16);
    let r = (num >> 16) + Math.round(255 * pct/100);
    let g = ((num >> 8) & 0xff) + Math.round(255 * pct/100);
    let b = (num & 0xff) + Math.round(255 * pct/100);
    r = Math.min(255, r); g = Math.min(255, g); b = Math.min(255, b);
    return `rgb(${r},${g},${b})`;
  }
 
  function draw(){
    ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
 
    // grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    for(let x = 0; x <= COLS; x++){
      ctx.beginPath();
      ctx.moveTo(x*CELL, 0);
      ctx.lineTo(x*CELL, ROWS*CELL);
      ctx.stroke();
    }
    for(let y = 0; y <= ROWS; y++){
      ctx.beginPath();
      ctx.moveTo(0, y*CELL);
      ctx.lineTo(COLS*CELL, y*CELL);
      ctx.stroke();
    }
 
    // settled cells
    for(let y = 0; y < ROWS; y++){
      for(let x = 0; x < COLS; x++){
        const val = grid[y][x];
        if(val){
          const flashing = flashRows.includes(y);
          drawCell(ctx, x*CELL, y*CELL, CELL, flashing ? '#ffffff' : COLORS[val], false);
        }
      }
    }
 
    if(current && !gameOver){
      // ghost
      const dist = ghostPosition();
      ctx.save();
      ctx.globalAlpha = 0.18;
      for(const c of current.cells){
        const x = current.x + c.x, y = current.y + c.y + dist;
        if(y >= 0) drawCell(ctx, x*CELL, y*CELL, CELL, COLORS[current.key], false);
      }
      ctx.restore();
 
      // active piece
      for(const c of current.cells){
        const x = current.x + c.x, y = current.y + c.y;
        if(y >= 0) drawCell(ctx, x*CELL, y*CELL, CELL, COLORS[current.key], true);
      }
    }
  }
 
  function drawMiniPiece(c, canvas, key){
    c.clearRect(0, 0, canvas.width, canvas.height);
    if(!key) return;
    const cells = SHAPES[key];
    const size = 18;
    const xs = cells.map(p=>p[0]), ys = cells.map(p=>p[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const w = (maxX - minX + 1) * size, h = (maxY - minY + 1) * size;
    const offX = (canvas.width - w) / 2 - minX * size;
    const offY = (canvas.height - h) / 2 - minY * size;
    for(const [px, py] of cells){
      drawCell(c, offX + px*size, offY + py*size, size, COLORS[key], true);
    }
  }
 
  function drawNext(){
    drawMiniPiece(nextCtx, nextCanvas, nextQueue[0]);
  }
  function drawHold(){
    drawMiniPiece(holdCtx, holdCanvas, holdPiece);
  }
 
  function updateStats(){
    document.getElementById('score').textContent = score;
    document.getElementById('lines').textContent = lines;
    document.getElementById('level').textContent = level;
  }
 
  // ---------- Overlay ----------
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const overlayBtn = document.getElementById('overlayBtn');
 
  function showOverlay(title, text, btnLabel){
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlayBtn.textContent = btnLabel;
    overlay.classList.add('show');
  }
  function hideOverlay(){
    overlay.classList.remove('show');
  }
 
  function triggerGameOver(){
    gameOver = true;
    running = false;
    playLoseSound();
    showOverlay('GAME OVER', `Final score: ${score}. Press restart to try again.`, 'RESTART');
  }
 
  // ---------- Game loop ----------
  function loop(timestamp){
    if(!lastTime) lastTime = timestamp;
    const delta = timestamp - lastTime;
    lastTime = timestamp;
 
    if(running && !paused && !gameOver){
      dropTimer += delta;
      if(dropTimer > dropInterval){
        dropTimer = 0;
        if(!collides(current, 0, 1)){
          current.y++;
        } else {
          lockPiece(current);
        }
      }
      draw();
    }
    animFrame = requestAnimationFrame(loop);
  }
 
  // ---------- Controls ----------
  document.addEventListener('keydown', (e) => {
    if(!running || paused || gameOver){
      if(e.code === 'KeyP' && running && !gameOver) togglePause();
      return;
    }
    switch(e.code){
      case 'ArrowLeft': move(-1); draw(); e.preventDefault(); break;
      case 'ArrowRight': move(1); draw(); e.preventDefault(); break;
      case 'ArrowDown': softDrop(); draw(); e.preventDefault(); break;
      case 'ArrowUp':
      case 'KeyZ': tryRotate(current); draw(); e.preventDefault(); break;
      case 'Space': hardDrop(); draw(); e.preventDefault(); break;
      case 'KeyC': doHold(); draw(); e.preventDefault(); break;
      case 'KeyP': togglePause(); e.preventDefault(); break;
    }
  });
 
  function togglePause(){
    if(gameOver || !running) return;
    paused = !paused;
    if(paused){
      showOverlay('PAUSED', 'Press resume or hit P to continue.', 'RESUME');
    } else {
      hideOverlay();
    }
  }
 
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  overlayBtn.addEventListener('click', () => {
    if(gameOver) startGame();
    else togglePause();
  });
 
  function startGame(){
    grid = createGrid();
    nextQueue = [];
    holdPiece = null;
    canHold = true;
    score = 0; lines = 0; level = 1;
    dropInterval = 800;
    dropTimer = 0;
    gameOver = false;
    paused = false;
    running = true;
    current = spawnPiece();
    updateStats();
    drawHold();
    drawNext();
    hideOverlay();
    draw();
  }
 
  const origSpawn = spawnPiece;
 
  // wrap spawnPiece to update next preview after each spawn
  function spawnPieceWrapped(){
    const p = origSpawn();
    drawNext();
    return p;
  }
  // Replace references
  spawnPiece = spawnPieceWrapped;
 
  // ---------- Touch controls ----------
  document.getElementById('touchControls').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn || !running || paused || gameOver) return;
    const act = btn.dataset.act;
    if(act === 'left') move(-1);
    else if(act === 'right') move(1);
    else if(act === 'down') softDrop();
    else if(act === 'rotate') tryRotate(current);
    else if(act === 'drop') hardDrop();
    else if(act === 'hold') doHold();
    draw();
  });
 
  window.addEventListener('resize', resizeBoard);
 
  // ---------- Init ----------
  resizeBoard();
  drawNext();
  drawHold();
  updateStats();
  showOverlay('NEON STACK', 'Press start to drop into the well.', 'START');
  animFrame = requestAnimationFrame(loop);
})();
</script>
