<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keystone Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --steel-900:#14161a;
    --steel-800:#1b1d22;
    --steel-700:#24272e;
    --steel-600:#33363f;
    --steel-500:#4a4e59;
    --brass:#c98a3e;
    --brass-bright:#e0a75c;
    --paper:#edeae3;
    --paper-dim:#a8a49a;
    --teal:#4f8a78;
    --teal-bright:#6fb59f;
    --rust:#b5533c;
    --rust-bright:#d76a4e;
  }
 
  *{ box-sizing:border-box; }
 
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 0%, #202329 0%, var(--steel-900) 60%);
    font-family:'Space Grotesk', sans-serif;
    color:var(--paper);
    padding:32px 16px;
  }
 
  .rig{
    width:100%;
    max-width:420px;
  }
 
  .plate{
    background:var(--steel-800);
    border:1px solid var(--steel-600);
    border-radius:6px;
    padding:28px;
    position:relative;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }
 
  .plate::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1px solid var(--steel-600);
    border-radius:3px;
    pointer-events:none;
  }
 
  .rivet{
    position:absolute;
    width:6px; height:6px;
    border-radius:50%;
    background:var(--steel-500);
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.05);
  }
  .rivet.tl{ top:14px; left:14px; }
  .rivet.tr{ top:14px; right:14px; }
  .rivet.bl{ bottom:14px; left:14px; }
  .rivet.br{ bottom:14px; right:14px; }
 
  .header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:20px;
  }
 
  .brandmark{
    font-size:15px;
    font-weight:700;
    letter-spacing:0.02em;
  }
  .brandmark span{ color:var(--brass); }
 
  .idtag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--paper-dim);
  }
 
  .aperture-frame{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    background:#0c0d10;
    border-radius:4px;
    overflow:hidden;
    border:1px solid var(--steel-600);
  }
 
  video, canvas.overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  video{ transform:scaleX(-1); filter:grayscale(0.15) contrast(1.05); }
  canvas.overlay{ transform:scaleX(-1); pointer-events:none; }
 
  .aperture-frame.idle video{ opacity:0.55; }
 
  .placeholder-eye{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    color:var(--paper-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    text-align:center;
    padding:20px;
    transition:opacity 0.4s ease;
  }
  .aperture-frame.live .placeholder-eye{ opacity:0; pointer-events:none; }
 
  .reticle{
    position:absolute;
    inset:14%;
    pointer-events:none;
  }
  .reticle .corner{
    position:absolute;
    width:22px; height:22px;
    border:2px solid var(--brass);
    opacity:0.55;
    transition: all 0.35s cubic-bezier(.4,0,.2,1);
  }
  .corner.c1{ top:0; left:0; border-right:none; border-bottom:none; }
  .corner.c2{ top:0; right:0; border-left:none; border-bottom:none; }
  .corner.c3{ bottom:0; left:0; border-right:none; border-top:none; }
  .corner.c4{ bottom:0; right:0; border-left:none; border-top:none; }
 
  .aperture-frame.face-found .reticle{ inset:8%; }
  .aperture-frame.face-found .corner{ border-color:var(--teal-bright); opacity:1; }
 
  .aperture-frame.scanning .reticle .corner{
    animation: pulseCorner 1.1s ease-in-out infinite;
  }
  @keyframes pulseCorner{
    0%,100%{ opacity:0.55; }
    50%{ opacity:1; }
  }
 
  .scanline{
    position:absolute;
    left:0; right:0;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--brass-bright), transparent);
    top:0;
    opacity:0;
  }
  .aperture-frame.scanning .scanline{
    opacity:0.85;
    animation: sweep 1.6s linear infinite;
  }
  @keyframes sweep{
    0%{ top:6%; }
    100%{ top:94%; }
  }
 
  .verdict-flash{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(12,13,16,0.72);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
  }
  .verdict-flash.show{ opacity:1; pointer-events:auto; }
 
  .ring{
    width:64px; height:64px;
    border-radius:50%;
    border:2px solid var(--teal-bright);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .verdict-flash.deny .ring{ border-color:var(--rust-bright); }
  .ring::before, .ring::after{
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:50%;
    border:1px solid var(--teal-bright);
    opacity:0;
  }
  .verdict-flash.deny .ring::before, .verdict-flash.deny .ring::after{ border-color:var(--rust-bright); }
  .verdict-flash.show .ring::before{ animation: ringPulse 0.9s ease-out; }
  .verdict-flash.show .ring::after{ animation: ringPulse 0.9s ease-out 0.2s; }
  @keyframes ringPulse{
    0%{ transform:scale(0.8); opacity:0.9; }
    100%{ transform:scale(1.6); opacity:0; }
  }
 
  .verdict-flash svg{ width:26px; height:26px; }
  .verdict-flash path{
    fill:none;
    stroke:var(--teal-bright);
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:40;
    stroke-dashoffset:40;
  }
  .verdict-flash.deny path{ stroke:var(--rust-bright); }
  .verdict-flash.show path{ animation: draw 0.4s ease-out 0.15s forwards; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
 
  .verdict-flash.deny .aperture-frame{ animation:none; }
  .aperture-frame.shake{ animation: shake 0.4s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-6px); }
    40%{ transform:translateX(5px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(3px); }
  }
 
  .ticker{
    margin-top:14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--paper-dim);
    display:flex;
    align-items:center;
    gap:8px;
    min-height:16px;
  }
  .ticker .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--brass);
    flex-shrink:0;
  }
  .ticker.busy .dot{ animation:blink 1s ease-in-out infinite; }
  .ticker.ok .dot{ background:var(--teal-bright); animation:none; }
  .ticker.err .dot{ background:var(--rust-bright); animation:none; }
  @keyframes blink{ 0%,100%{ opacity:1; } 50%{ opacity:0.25; } }
 
  .controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:18px;
  }
 
  button.plate-btn{
    font-family:'Space Grotesk', sans-serif;
    font-size:13px;
    font-weight:500;
    letter-spacing:0.01em;
    color:var(--paper);
    background:var(--steel-700);
    border:1px solid var(--steel-500);
    border-radius:4px;
    padding:11px 14px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition: border-color 0.2s ease, color 0.2s ease, transform 0.08s ease;
  }
  button.plate-btn::before{
    content:"";
    position:absolute;
    inset:0;
    background:var(--brass);
    transform:translateY(101%);
    transition:transform 0.22s cubic-bezier(.4,0,.2,1);
    z-index:0;
  }
  button.plate-btn span{ position:relative; z-index:1; }
  button.plate-btn:hover:not(:disabled)::before{ transform:translateY(0); }
  button.plate-btn:hover:not(:disabled){ color:var(--steel-900); border-color:var(--brass); }
  button.plate-btn:active:not(:disabled){ transform:scale(0.97); }
  button.plate-btn:disabled{ opacity:0.4; cursor:not-allowed; }
 
  button.plate-btn.primary{ border-color:var(--brass); }
  button.plate-btn.primary::before{ transform:translateY(0); background:var(--brass); }
  button.plate-btn.primary span{ color:var(--steel-900); }
  button.plate-btn.primary:hover:not(:disabled)::before{ background:var(--brass-bright); }
  button.plate-btn.primary:disabled::before{ transform:translateY(0); }
 
  .vault{
    margin-top:18px;
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition: max-height 0.5s cubic-bezier(.4,0,.2,1), opacity 0.4s ease 0.1s;
  }
  .vault.open{
    max-height:400px;
    opacity:1;
  }
 
  .vault-inner{
    border-top:1px solid var(--steel-600);
    padding-top:16px;
  }
 
  .vault-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid var(--steel-700);
    font-size:12px;
    color:var(--paper-dim);
  }
  .vault-row:last-child{ border-bottom:none; }
  .vault-row .label{ color:var(--paper); }
 
  .toggle{
    width:34px; height:18px;
    border-radius:10px;
    background:var(--steel-600);
    position:relative;
    cursor:pointer;
    flex-shrink:0;
    transition:background 0.2s ease;
  }
  .toggle::after{
    content:"";
    position:absolute;
    top:2px; left:2px;
    width:14px; height:14px;
    border-radius:50%;
    background:var(--paper-dim);
    transition: transform 0.2s cubic-bezier(.4,0,.2,1), background 0.2s ease;
  }
  .toggle.on{ background:var(--teal); }
  .toggle.on::after{ transform:translateX(16px); background:var(--paper); }
 
  .signout{
    margin-top:14px;
    width:100%;
  }
 
  .footer-note{
    margin-top:16px;
    font-size:10.5px;
    color:var(--steel-500);
    line-height:1.5;
    font-family:'IBM Plex Mono', monospace;
  }
</style>
</head>
<body>
 
<div class="rig">
  <div class="plate">
    <div class="rivet tl"></div>
    <div class="rivet tr"></div>
    <div class="rivet bl"></div>
    <div class="rivet br"></div>
 
    <div class="header">
      <div class="brandmark">KEYSTONE <span>ACCESS</span></div>
      <div class="idtag" id="clock">--:--:--</div>
    </div>
 
    <div class="aperture-frame idle" id="apertureFrame">
      <video id="video" autoplay muted playsinline></video>
      <canvas class="overlay" id="overlay"></canvas>
      <div class="scanline"></div>
      <div class="reticle">
        <div class="corner c1"></div>
        <div class="corner c2"></div>
        <div class="corner c3"></div>
        <div class="corner c4"></div>
      </div>
      <div class="placeholder-eye" id="placeholderText">
        CAMERA STANDBY<br>press "activate camera" to begin
      </div>
      <div class="verdict-flash" id="verdictFlash">
        <div class="ring">
          <svg viewBox="0 0 24 24"><path id="verdictPath" d=""></path></svg>
        </div>
      </div>
    </div>
 
    <div class="ticker" id="ticker">
      <div class="dot"></div>
      <span id="tickerText">system idle</span>
    </div>
 
    <div class="controls">
      <button class="plate-btn" id="camBtn"><span>Activate camera</span></button>
      <button class="plate-btn" id="enrollBtn" disabled><span>Enroll face</span></button>
    </div>
    <div class="controls" style="grid-template-columns:1fr; margin-top:10px;">
      <button class="plate-btn primary" id="verifyBtn" disabled><span>Verify identity</span></button>
    </div>
 
    <div class="vault" id="vault">
      <div class="vault-inner">
        <div class="vault-row">
          <span class="label">Access granted</span>
          <span id="grantedTime">--</span>
        </div>
        <div class="vault-row">
          <span class="label">Match confidence</span>
          <span id="matchScore">--</span>
        </div>
        <div class="vault-row">
          <span class="label">Session lock</span>
          <div class="toggle on" id="lockToggle"></div>
        </div>
        <div class="vault-row">
          <span class="label">Motion alerts</span>
          <div class="toggle" id="motionToggle"></div>
        </div>
        <button class="plate-btn signout" id="signoutBtn"><span>End session</span></button>
      </div>
    </div>
 
    <div class="footer-note">
      Face data stays in this browser tab and is discarded on reload. Nothing is uploaded. For production use, pair this UI with a server-side auth flow.
    </div>
  </div>
</div>
 
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<script>
const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model";
 
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
const apertureFrame = document.getElementById('apertureFrame');
const placeholderText = document.getElementById('placeholderText');
const ticker = document.getElementById('ticker');
const tickerText = document.getElementById('tickerText');
const camBtn = document.getElementById('camBtn');
const enrollBtn = document.getElementById('enrollBtn');
const verifyBtn = document.getElementById('verifyBtn');
const verdictFlash = document.getElementById('verdictFlash');
const verdictPath = document.getElementById('verdictPath');
const vault = document.getElementById('vault');
const grantedTime = document.getElementById('grantedTime');
const matchScore = document.getElementById('matchScore');
const signoutBtn = document.getElementById('signoutBtn');
const lockToggle = document.getElementById('lockToggle');
const motionToggle = document.getElementById('motionToggle');
const clock = document.getElementById('clock');
 
const CHECK_PATH = "M4 12.5 L9.5 18 L20 6";
const CROSS_PATH = "M6 6 L18 18 M18 6 L6 18";
const MATCH_THRESHOLD = 0.5;
 
let modelsReady = false;
let detectLoopHandle = null;
let enrolledDescriptor = null;
let busy = false;
 
function setTicker(msg, state){
  tickerText.textContent = msg;
  ticker.className = 'ticker' + (state ? ' ' + state : '');
}
 
function tickClock(){
  const now = new Date();
  clock.textContent = now.toTimeString().slice(0,8);
}
setInterval(tickClock, 1000);
tickClock();
 
async function loadModels(){
  setTicker('loading detection models…', 'busy');
  await Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
  ]);
  modelsReady = true;
  setTicker('models loaded — camera on standby');
}
 
async function startCamera(){
  camBtn.disabled = true;
  setTicker('requesting camera access…', 'busy');
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width:480, height:360 }, audio:false });
    video.srcObject = stream;
    await new Promise(res => video.onloadedmetadata = res);
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
    apertureFrame.classList.remove('idle');
    apertureFrame.classList.add('live', 'scanning');
    if(!modelsReady) await loadModels();
    setTicker('scanning for face…', 'busy');
    enrollBtn.disabled = false;
    runDetectionLoop();
  }catch(err){
    setTicker('camera access denied — check browser permissions', 'err');
    camBtn.disabled = false;
  }
}
 
async function runDetectionLoop(){
  const opts = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
  async function tick(){
    if(!video.srcObject) return;
    const result = await faceapi.detectSingleFace(video, opts).withFaceLandmarks().withFaceDescriptor();
    octx.clearRect(0,0,overlay.width, overlay.height);
    if(result){
      apertureFrame.classList.add('face-found');
      if(enrolledDescriptor){
        verifyBtn.disabled = false;
      }
      window.__lastDescriptor = result.descriptor;
      if(!busy) setTicker(enrolledDescriptor ? 'face detected — ready to verify' : 'face detected — ready to enroll');
    } else {
      apertureFrame.classList.remove('face-found');
      window.__lastDescriptor = null;
      verifyBtn.disabled = true;
      if(!busy) setTicker('scanning for face…', 'busy');
    }
    detectLoopHandle = requestAnimationFrame(tick);
  }
  tick();
}
 
function flashVerdict(success, label){
  return new Promise(resolve => {
    verdictPath.setAttribute('d', success ? CHECK_PATH : CROSS_PATH);
    verdictFlash.className = 'verdict-flash show' + (success ? '' : ' deny');
    if(!success){
      apertureFrame.classList.add('shake');
      setTimeout(() => apertureFrame.classList.remove('shake'), 400);
    }
    setTicker(label, success ? 'ok' : 'err');
    setTimeout(() => {
      verdictFlash.className = 'verdict-flash';
      resolve();
    }, 1300);
  });
}
 
enrollBtn.addEventListener('click', async () => {
  if(!window.__lastDescriptor || busy) return;
  busy = true;
  enrollBtn.disabled = true;
  setTicker('capturing facial signature…', 'busy');
  await new Promise(r => setTimeout(r, 500));
  enrolledDescriptor = window.__lastDescriptor;
  await flashVerdict(true, 'face enrolled — you can now verify');
  busy = false;
  enrollBtn.disabled = false;
  verifyBtn.disabled = !window.__lastDescriptor;
});
 
verifyBtn.addEventListener('click', async () => {
  if(!window.__lastDescriptor || !enrolledDescriptor || busy) return;
  busy = true;
  verifyBtn.disabled = true;
  setTicker('comparing against enrolled signature…', 'busy');
  await new Promise(r => setTimeout(r, 600));
  const distance = faceapi.euclideanDistance(enrolledDescriptor, window.__lastDescriptor);
  const success = distance < MATCH_THRESHOLD;
  const confidence = Math.max(0, (1 - distance) * 100).toFixed(1);
  if(success){
    await flashVerdict(true, 'identity confirmed — access granted');
    grantedTime.textContent = new Date().toTimeString().slice(0,8);
    matchScore.textContent = confidence + '%';
    vault.classList.add('open');
  } else {
    await flashVerdict(false, 'no match — access denied (' + confidence + '% confidence)');
  }
  busy = false;
  verifyBtn.disabled = !window.__lastDescriptor;
});
 
signoutBtn.addEventListener('click', () => {
  vault.classList.remove('open');
  setTicker(window.__lastDescriptor ? 'face detected — ready to verify' : 'scanning for face…');
});
 
[lockToggle, motionToggle].forEach(t => {
  t.addEventListener('click', () => t.classList.toggle('on'));
});
 
camBtn.addEventListener('click', startCamera);
</script>
 
</body>
</html>
