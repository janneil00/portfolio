<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SNAKE // TERMINAL</title>
<style>
  :root{
    --amber: #ffb000;
    --amber-dim: #7a5400;
    --amber-bright: #ffd670;
    --bg: #0d0a06;
    --bg-panel: #171008;
    --crt-line: rgba(255,176,0,0.04);
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; height:100%;
    background: radial-gradient(ellipse at center, #1a1208 0%, #0a0704 100%);
    display:flex; align-items:center; justify-content:center;
    font-family: 'Courier New', Courier, monospace;
    color: var(--amber);
  }
  .cabinet{
    position:relative;
    padding: 28px 32px 22px;
    background: var(--bg-panel);
    border-radius: 14px;
    border: 1px solid #3a2a10;
    box-shadow:
      0 0 0 1px #000 inset,
      0 20px 60px rgba(0,0,0,0.7),
      0 0 40px rgba(255,176,0,0.06);
  }
  .screen-wrap{
    position:relative;
    border-radius: 4px;
    overflow:hidden;
    background: var(--bg);
    box-shadow: 0 0 30px rgba(255,176,0,0.15) inset, 0 0 2px #000;
  }
  canvas{
    display:block;
    image-rendering: pixelated;
  }
  .scanlines{
    pointer-events:none;
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      to bottom,
      var(--crt-line) 0px,
      var(--crt-line) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
  }
  .glow-vignette{
    pointer-events:none;
    position:absolute; inset:0;
    box-shadow: inset 0 0 80px 20px rgba(0,0,0,0.6);
  }
  .hud{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom: 10px;
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(255,176,0,0.6);
    font-size: 13px;
  }
  .hud .label{ color: var(--amber-dim); font-size: 10px; }
  .hud .value{ font-size: 18px; color: var(--amber-bright); }
  .title{
    text-align:center;
    letter-spacing: 6px;
    font-size: 11px;
    color: var(--amber-dim);
    margin-bottom: 16px;
  }
  .title b{ color: var(--amber); }
  .footer{
    margin-top: 14px;
    text-align:center;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--amber-dim);
  }
  .footer kbd{
    border: 1px solid var(--amber-dim);
    border-radius: 3px;
    padding: 1px 6px;
    color: var(--amber);
    font-size: 10px;
  }
  #overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    background: rgba(10,7,4,0.82);
    text-shadow: 0 0 10px rgba(255,176,0,0.7);
    letter-spacing: 2px;
    gap: 10px;
    transition: opacity .2s ease;
  }
  #overlay h1{
    font-size: 22px; margin:0;
    color: var(--amber-bright);
  }
  #overlay p{ margin:0; font-size:12px; color: var(--amber-dim); }
  #overlay .hint{
    margin-top: 8px;
    font-size: 11px;
    color: var(--amber);
    border: 1px solid var(--amber-dim);
    padding: 6px 14px;
    border-radius: 3px;
    cursor: default;
  }
  .hidden{ opacity:0; pointer-events:none; }
</style>
</head>
<body>

<div class="cabinet">
  <div class="title">◢◤ ARCADE UNIT — <b>PYTHON&nbsp;PROTOCOL</b> ◢◤</div>
  <div class="hud">
    <div><span class="label">SCORE&nbsp;</span><span class="value" id="score">000</span></div>
    <div><span class="label">BEST&nbsp;</span><span class="value" id="best">000</span></div>
  </div>
  <div class="screen-wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="scanlines"></div>
    <div class="glow-vignette"></div>
    <div id="overlay">
      <h1 id="overlayTitle">MAGHANDA KANA BOBO</h1>
      <p id="overlaySub">KUHAIN ANG BILOG. WAG MONG PUNGUDIN SARILI MO, WAG KANG BOBO!!!!. WAG NA HABULIN PAG AYAW NA SAYU WAG KANG TANGA!!</p>
      <div class="hint">PRESS ANY ARROW / PINDUTIN ANG WASD PARA MAG START</div>
    </div>
  </div>
  <div class="footer">
    <kbd>&larr;</kbd> <kbd>&uarr;</kbd> <kbd>&darr;</kbd> <kbd>&rarr;</kbd> or <kbd>WASD</kbd> — steer &nbsp;•&nbsp; <kbd>SPACE</kbd> — pause
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const GRID = 20;
  const CELLS = 20;
  canvas.width = GRID * CELLS;
  canvas.height = GRID * CELLS;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');

  let best = Number(localStorage.getItem('snake_best_amber') || 0);
  bestEl.textContent = pad(best);

  let snake, dir, nextDir, food, score, alive, running, tickMs, timer, paused;

  function pad(n){ return String(n).padStart(3,'0'); }

  function reset(){
    snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    tickMs = 120;
    alive = true;
    paused = false;
    placeFood();
    scoreEl.textContent = pad(score);
    draw();
  }

  function placeFood(){
    let ok = false;
    while(!ok){
      food = { x: Math.floor(Math.random()*CELLS), y: Math.floor(Math.random()*CELLS) };
      ok = !snake.some(s => s.x===food.x && s.y===food.y);
    }
  }

  function start(){
    if (running) return;
    running = true;
    overlay.classList.add('hidden');
    loop();
  }

  function loop(){
    clearTimeout(timer);
    if (!alive || paused) return;
    timer = setTimeout(()=>{
      step();
      draw();
      loop();
    }, tickMs);
  }

  function step(){
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS || snake.some(s => s.x===head.x && s.y===head.y)){
      die();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y){
      score++;
      scoreEl.textContent = pad(score);
      if (tickMs > 55) tickMs -= 2.5;
      placeFood();
    } else {
      snake.pop();
    }
  }

  function die(){
    alive = false;
    running = false;
    if (score > best){
      best = score;
      localStorage.setItem('snake_best_amber', best);
      bestEl.textContent = pad(best);
      overlayTitle.textContent = 'MAY BAGO KANG HIGHEST SCORE — ' + pad(score);
      overlaySub.textContent = 'Naka record na kabobohan mo.';
    } else {
      overlayTitle.textContent = 'AY BOBO PATAY KANA GAGO!!!!';
      overlaySub.textContent = 'Signal terminated at ' + pad(score) + ' units.';
    }
    document.querySelector('.hint').textContent = 'PRESS ANY ARROW / PINDUTIN MO WASD PARA MAG RESTART';
    overlay.classList.remove('hidden');
  }

  function draw(){
    ctx.fillStyle = '#0d0a06';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // faint grid
    ctx.strokeStyle = 'rgba(255,176,0,0.05)';
    ctx.lineWidth = 1;
    for(let i=0;i<=CELLS;i++){
      ctx.beginPath(); ctx.moveTo(i*GRID+0.5,0); ctx.lineTo(i*GRID+0.5,canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*GRID+0.5); ctx.lineTo(canvas.width,i*GRID+0.5); ctx.stroke();
    }

    // food — pulsing node
    const pulse = 2 + Math.sin(Date.now()/180)*1.2;
    ctx.fillStyle = '#ffd670';
    ctx.shadowColor = '#ffb000';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(food.x*GRID+GRID/2, food.y*GRID+GRID/2, GRID/2 - 3 + pulse*0.3, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // snake
    snake.forEach((s,i)=>{
      const t = i / snake.length;
      const alpha = 1 - t*0.55;
      ctx.fillStyle = i===0 ? '#ffe9b0' : `rgba(255,176,0,${alpha})`;
      ctx.shadowColor = 'rgba(255,176,0,0.5)';
      ctx.shadowBlur = i===0 ? 8 : 2;
      const pad = i===0 ? 1 : 2;
      ctx.fillRect(s.x*GRID+pad, s.y*GRID+pad, GRID-pad*2, GRID-pad*2);
    });
    ctx.shadowBlur = 0;
  }

  function setDir(x,y){
    if (dir.x === -x && dir.y === -y) return; // no reversing
    nextDir = {x,y};
  }

  function togglePause(){
    if (!alive) return;
    paused = !paused;
    if (paused){
      overlayTitle.textContent = 'PAUSED';
      overlaySub.textContent = 'Signal holding steady.';
      document.querySelector('.hint').textContent = 'PRESS SPACE TO RESUME';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
      loop();
    }
  }

  window.addEventListener('keydown', (e)=>{
    const k = e.key.toLowerCase();
    const map = {
      arrowup:[0,-1], w:[0,-1],
      arrowdown:[0,1], s:[0,1],
      arrowleft:[-1,0], a:[-1,0],
      arrowright:[1,0], d:[1,0]
    };
    if (k === ' '){
      e.preventDefault();
      togglePause();
      return;
    }
    if (map[k]){
      e.preventDefault();
      if (!alive){
        reset();
        setDir(...map[k]);
        start();
        return;
      }
      setDir(...map[k]);
      if (!running) start();
    }
  });

  reset();
})();
</script>

</body>
</html>
